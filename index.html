<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite" aria-atomic="true">
    <p id="status"></p>
    <div id="ready" hidden>
      <p>Тема: <strong id="topic"></strong></p>
      <p>Черновик ответа (проверьте перед отправкой):</p>
      <pre id="draft"></pre>
    </div>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = new Map([["delivery", "Доставка"], ["pricing", "Стоимость"], ["other", "Другое"]]);
    let latestRequest = 0;
    let activeController;

    function clearResult() {
      topic.textContent = "";
      draft.textContent = "";
      ready.hidden = true;
    }

    function manualReview() {
      clearResult();
      status.textContent = "Требуется ручной разбор. AI не подготовил корректный ответ. Проверьте исходную заявку и составьте ответ вручную или повторите попытку.";
    }

    function invalidateRequest() {
      latestRequest += 1;
      activeController?.abort();
      activeController = undefined;
      clearResult();
      status.textContent = "";
    }

    // A result for edited text must not be presented as a result for the new text.
    message.addEventListener("input", invalidateRequest);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      invalidateRequest();
      const requestId = latestRequest;
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        return;
      }
      const controller = new AbortController();
      activeController = controller;
      // The API has its own 300 ms model deadline; this is a separate network guard.
      const timer = setTimeout(() => controller.abort(), 3000);
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        const result = await reply.json();
        if (requestId !== latestRequest) return;
        if (reply.status === 400 && result?.status === "invalid_input") {
          status.textContent = "Введите текст заявки.";
        } else if (reply.ok && result?.status === "ready" && topics.has(result.topic)
                   && typeof result.draft === "string" && result.draft.trim()) {
          topic.textContent = topics.get(result.topic);
          draft.textContent = result.draft.trim();
          ready.hidden = false;
          status.textContent = "Черновик готов. Проверьте его перед отправкой.";
        } else {
          manualReview();
        }
      } catch {
        if (requestId === latestRequest) manualReview();
      } finally {
        clearTimeout(timer);
        if (requestId === latestRequest) activeController = undefined;
      }
    });
  </script>
</body>
</html>
